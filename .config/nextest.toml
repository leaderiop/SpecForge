[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"

[profile.ci]
retries = 1
fail-fast = false
status-level = "all"

# scripts/gate.sh: every failure, no retries, and room for the watcher tests
# (~40 s each when run alongside clippy) before a hang is killed.
[profile.gate]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"
