[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"

# CI (`cargo gate ci`): tests run beside clippy and the guests, as they do
# locally, so the watcher tests get the `gate` profile's room.
[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "all"

# `cargo gate` (quick and full): every failure, no retries, and room for the
# watcher tests (~40 s each when run alongside clippy) before a hang is killed.
[profile.gate]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"

# The JUnit report the gate's `dogfood` reads (ADR 0374 D5): nextest writes it under
# `<workspace root>/target/nextest/<profile>/` (its store is relative to the workspace root,
# not `CARGO_TARGET_DIR`), and `@rust/test` turns it into `test` facts.
[profile.gate.junit]
path = "junit.xml"

[profile.ci.junit]
path = "junit.xml"

# Builds a scaffolded extension crate from cold, in a fresh directory: a
# real `cargo build --release --target wasm32-wasip2` of the SDK and its
# dependencies, which takes minutes on a loaded machine. Inherited by every
# profile.
[[profile.default.overrides]]
filter = "package(specforge-cli) & test(=extension_authoring::a_scaffolded_extension_builds_and_validates)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Applies one edit plan of as many creates as the `gsd import` operation cap
# (`MAX_OPS` in gsd/import/src/limits.rs, ADR 0391 D9): ~38 s at 2,000 on an
# idle machine, past the default 60 s bound when loaded.
[[profile.default.overrides]]
filter = "package(specforge-ops) & test(=plans::one_plan_of_many_creates_applies)"
slow-timeout = { period = "60s", terminate-after = 3 }

# absorb's end-to-end tests load `@gsd/core` and the old builtins cold on a
# Windows runner, where a compile takes longer than the default kill bound
# allows (ADR 0375 D4). Windows only: the Linux and macOS bounds are unchanged.
[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = "binary_id(xtask::absorb_e2e)"
slow-timeout = { period = "60s", terminate-after = 10 }
