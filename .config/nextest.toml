[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"

[profile.ci]
retries = 1
fail-fast = false
status-level = "all"

# scripts/gate.sh: every failure, no retries, and room for the watcher tests
# (~40 s each when run alongside clippy) before a hang is killed.
[profile.gate]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"

# scripts/gate.sh (quick mode): like `gate`, and the place to skip slow
# tests in the per-step loop. The full gate and CI (`ci` profile) always
# run every test. No test is slow today: after `cargo clean` freed the
# disk, the slowest take ~1 s. To skip one that becomes slow, add e.g.
#   default-filter = "not (package(specforge-watch) & binary(tests) & test(/^watcher::/))"
# (`cargo nextest run --workspace --status-level all` prints each test's time).
[profile.quick]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"
