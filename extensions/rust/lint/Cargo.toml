[package]
name = "specforge-ext-rust-lint"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
specforge-code-facts = { path = "../../code/facts" }
serde_json = "1.0"

[dev-dependencies]
# Spec links: #[specforge_test(requirement = "…")] (ADR 0002).
specforge-test = { path = "../../../integrations/rust/specforge-test" }
insta = { version = "1.46.3", features = ["json"] }
