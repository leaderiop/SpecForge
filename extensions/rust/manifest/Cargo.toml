[package]
name = "specforge-rust-manifest"
version = "1.0.0"
edition = "2021"
description = "Reads every Cargo.toml of a project with cargo_toml into @code/core's package facts (ADR 0348 D5); no guest"
publish = false

# An extension library (ADR 0328 D3): an rlib a builtin links, never embedded.
[lib]
crate-type = ["rlib"]

[dependencies]
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
specforge-code-facts = { path = "../../code/facts" }
# cargo's own manifest model: workspace inheritance and target autodiscovery over a file listing.
cargo_toml = "0.22"
# cargo_toml's own TOML reader, for where the `[package]` table is written.
toml = "0.9"

[dev-dependencies]
# Spec links: #[specforge_test(behavior = "…", verify = "…")] (ADR 0002).
specforge-test = { path = "../../../integrations/rust/specforge-test" }
serde_json = "1.0"
