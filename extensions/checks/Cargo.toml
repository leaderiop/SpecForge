[package]
name = "specforge-ext-checks"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
specforge-extension-sdk = { path = "../../crates/runtime/extension-sdk" }
specforge-checks-kit = { path = "../../crates/leaf/checks-kit", features = ["digits", "files", "formats", "git", "links", "structured"] }
serde_json = "1.0"
# The kit's own: one copy of each in the blob.
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
mime = "0.3.17"

[dev-dependencies]
specforge-extension-sdk = { path = "../../crates/runtime/extension-sdk", features = ["testing"] }
specforge-protocol-types = { path = "../../crates/leaf/protocol-types" }
# Spec links: #[specforge_test(behavior = "…", verify = "…")] (ADR 0002).
specforge-test = { path = "../../integrations/rust/specforge-test" }
