[package]
name = "specforge-ext-javascript-source"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
specforge-code-facts = { path = "../../code/facts" }
specforge-javascript-workspace = { path = "../workspace" }

[dev-dependencies]
# Spec links: #[specforge_test(behavior = "…", verify = "…")] (ADR 0002).
specforge-test = { path = "../../../integrations/rust/specforge-test" }
# The host's own source reader, serving the tests' syntax import as the host does (ADR 0344).
specforge-source = { path = "../../../crates/kernel/source" }
serde_json = "1.0"
