[package]
name = "specforge-code-lcov"
version = "1.0.0"
edition = "2021"
description = "The LCOV reader the coverage packs link (ADR 0388); no guest"
publish = false

# An extension library (ADR 0328 D3): an rlib a builtin links, never embedded.
[lib]
crate-type = ["rlib"]

[dependencies]
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
specforge-code-facts = { path = "../facts" }

[dev-dependencies]
serde_json = "1.0"
insta = { version = "1.46.3", features = ["json"] }
