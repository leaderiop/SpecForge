[package]
name = "specforge-code-cyclonedx"
version = "1.0.0"
edition = "2021"
description = "The CycloneDX JSON reader the SBOM packs link (ADR 0388); no guest"
publish = false

# An extension library (ADR 0328 D3): an rlib a builtin links, never embedded.
[lib]
crate-type = ["rlib"]

[dependencies]
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
specforge-code-facts = { path = "../facts" }
serde_json = "1.0"

[dev-dependencies]
insta = { version = "1.46.3", features = ["json"] }
