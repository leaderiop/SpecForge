[package]
name = "example-marketing"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not a member of the SpecForge workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Outside this repository, name the published SDK instead:
# specforge-extension-sdk = "<your specforge's version>"
specforge-extension-sdk = { path = "../../../crates/runtime/extension-sdk" }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
