# zstd 0.13 / zstd-safe 7.2 / zstd-sys 2.0 arrive only through wasmtime's `cache` feature, which
# compresses and decompresses wasmtime's own on-disk compile cache. No SpecForge input reaches
# them, and wasmtime 50.0.0 still pins the same zstd, so no upgrade clears these yet.
# Drop the list when wasmtime moves to zstd >= 0.14 / zstd-safe >= 8.2 / zstd-sys >= 2.1.2.
