ignore = [
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0395",
  "RUSTSEC-2026-0396",
  "RUSTSEC-2026-0397",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0399",
  "RUSTSEC-2026-0400",
  "RUSTSEC-2026-0401",
  "RUSTSEC-2026-0402",
