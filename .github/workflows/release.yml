name: Release

# Push a tag like v0.1.0 to build prebuilt binaries and publish a GitHub Release.
# The tag must match the workspace version in Cargo.toml (checked below).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          [ "v$version" = "${GITHUB_REF_NAME%%-*}" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The builtin extension blobs are committed and embedded, so no wasm
      # target is needed to build the CLI.
      - name: Build
        run: cargo build --release --locked -p specforge-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="specforge-${{ matrix.target }}"
          mkdir "$name"
          bin=specforge; [ "${{ matrix.ext }}" = zip ] && bin=specforge.exe
          cp "target/${{ matrix.target }}/release/$bin" "$name/"
          cp README.md "$name/"
          for f in LICENSE*; do [ -f "$f" ] && cp "$f" "$name/"; done || true
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          if command -v shasum >/dev/null; then shasum -a 256 "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"
          else sha256sum "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"; fi

      - name: Smoke test the packaged binary
        shell: bash
        run: |
          name="specforge-${{ matrix.target }}"
          bin=specforge; [ "${{ matrix.ext }}" = zip ] && bin=specforge.exe
          "$name/$bin" --version
          dir=$(mktemp -d); cd "$dir"
          "$GITHUB_WORKSPACE/$name/$bin" init --extensions @specforge/software
          "$GITHUB_WORKSPACE/$name/$bin" check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            specforge-${{ matrix.target }}.${{ matrix.ext }}
            specforge-${{ matrix.target }}.${{ matrix.ext }}.sha256

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums and render the Homebrew formula
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          cd ..
          bash scripts/render-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > dist/specforge.rb

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.1.0-rc1) are prereleases, never "latest".
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes $pre
