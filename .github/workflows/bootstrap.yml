name: Bootstrap

# A cold clone rebuilds every committed blob. It takes ~8 min uncached, so a PR runs it only when what the blobs
# compile from changes (the paths every `inputs.json` records, plus the build tooling); main runs it on every push.
# A gsd input runs it too: `gsd/core/**`, `gsd/kit/**`, `gsd/.cargo/**` (the SDK patch) and `gsd/Cargo.lock`, which
# `@gsd/core`'s record hashes whole. A gate test holds these paths to every input any record lists.
# A PR that misses it still has the `builtins` check (ci.yml), which compares each blob's recorded inputs.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/leaf/coverage/**"
      - "crates/leaf/cycles/**"
      - "crates/leaf/protocol-types/**"
      - "crates/leaf/checks-kit/**"
      - "crates/runtime/extension-sdk/**"
      - "crates/runtime/extension-sdk-macros/**"
      - "crates/runtime/component/src/committed.rs"
      - "extensions/**"
      - "fixtures/**"
      - "examples/marketing/extension/**"
      - "gsd/core/**"
      - "gsd/kit/**"
      - "gsd/Cargo.lock"
      - "gsd/.cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "gate/**"
      - ".github/workflows/bootstrap.yml"

env:
  CARGO_TERM_COLOR: always

# Every job starts a clock first and fails past its BUDGET_SECONDS last: the budget is the job's slowest cold wall
# time seen on the current code times 1.25, rounded up to a minute, under its timeout less five minutes (ADR 0375 D3).
jobs:
  bootstrap:
    name: Fresh-clone bootstrap (builtin components)
    runs-on: ubuntu-latest
    # A cold clone measured `cargo gate bootstrap` at 292 s and the equality step at 97 s on a workstation; a hosted
    # runner is several times slower. The bound stops a hung rebuild or a stalled toolchain install (a gate test
    # holds it).
    timeout-minutes: 45
    env:
      # Every run is cold (no cache by design): 1.25 x 1,360 s, its slowest run on the current code; its runs on one
      # code have taken 910 s to 1,360 s.
      BUDGET_SECONDS: 1740
    steps:
      - name: Start the build-time budget clock
        shell: bash
        run: |
          echo "BUDGET_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # The committed blobs build on one pinned rustc, gate::blob_inputs::BLOB_RUSTC (ADR 0373 D1); a gate test
      # holds this line to the constant. It is installed explicitly: a rustup that does not install a missing
      # toolchain implicitly would otherwise stop the job.
      - name: Install the pinned blob toolchain (gate::blob_inputs::BLOB_RUSTC)
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2

      # Prebuilt, as ci.yml installs it: the equality step below runs under it.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # No rust-cache here on purpose: this job must prove that a cold clone
      # can rebuild every builtin component blob from source via the xtask
      # escape hatch (wayfinder map #1, ticket #4).
      # Each blob is built in a staged workspace on the pinned rustc, so its bytes do not depend on the
      # checkout path: --verify rebuilds every committed blob (the builtins and the fixtures) and fails if one differs from the
      # vendored bytes, and fails, never skips, on a blob another rustc built.
      - name: Build all builtin component blobs from source and compare them with the vendored ones
        run: cargo gate bootstrap

      # `--verify` above compares every blob; this names the one the ADR pins. It is #[ignore]d so the gate's `tests`
      # check does not build the blob, and it fails, never skips, on a blob another rustc built or other bytes
      # (ADR 0366 D4, ADR 0373 D2).
      - name: Prove the committed @gsd/core blob is the stager's build on the pinned rustc
        run: cargo nextest run -p xtask --run-ignored only -E 'test(committed_gsd_core_blob_is_the_stagers_build)'

      - name: Build-time budget
        shell: bash
        run: |
          whole='^[0-9]+$'
          if ! [[ ${BUDGET_T0:-} =~ $whole ]]; then
            echo "::error title=Build-time budget::no clock: the job's first step recorded no BUDGET_T0"
            exit 1
          fi
          if ! [[ ${BUDGET_SECONDS:-} =~ $whole ]]; then
            echo "::error title=Build-time budget::no budget: BUDGET_SECONDS is not a whole number of seconds"
            exit 1
          fi
          took=$(( $(date +%s) - 10#$BUDGET_T0 ))
          line="this job took $took s of its $BUDGET_SECONDS s build-time budget (ADR 0375 D3)"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if (( took > 10#$BUDGET_SECONDS )); then
            echo "::error title=Build-time budget::$line"
            exit 1
          fi
          echo "$line"
