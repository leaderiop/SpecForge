name: Bootstrap

# A cold clone rebuilds every committed blob. It takes ~8 min uncached, so a PR runs it only when what the blobs
# compile from changes (the paths every `inputs.json` records, plus the build tooling); main runs it on every push.
# A PR that misses it still has the `builtins` check (ci.yml), which compares each blob's recorded inputs.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/leaf/coverage/**"
      - "crates/leaf/cycles/**"
      - "crates/leaf/protocol-types/**"
      - "crates/runtime/extension-sdk/**"
      - "crates/runtime/extension-sdk-macros/**"
      - "crates/runtime/component/src/committed.rs"
      - "extensions/**"
      - "fixtures/**"
      - "examples/marketing/extension/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "gate/**"
      - ".github/workflows/bootstrap.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  bootstrap:
    name: Fresh-clone bootstrap (builtin components)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # No rust-cache here on purpose: this job must prove that a cold clone
      # can rebuild every builtin component blob from source via the xtask
      # escape hatch (wayfinder map #1, ticket #4).
      # Each blob is built in a staged workspace, so its bytes do not depend on the
      # checkout path: --verify rebuilds every committed blob (the builtins and the fixtures) and fails if one differs from the
      # vendored bytes (a blob vendored by another rustc is built, not compared).
      - name: Build all builtin component blobs from source and compare them with the vendored ones
        run: cargo gate bootstrap
