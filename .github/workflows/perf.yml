name: Perf

# A measurement, not a check: `cargo gate ci` (ci.yml) is the list that blocks a merge, and its tests bound work by
# counts, never by time (ADR 0353 D8). This job times `specforge check` and `specforge collect --no-run` on a release
# build of SpecForge itself against the budget, and uploads report.json. Nightly and by hand only: never on a pull
# request, with no secret, and it pushes nothing.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Measure check and collect against the budget
        run: cargo run --locked -p xtask --bin perf-report -- --runs 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: target/perf/report.json
