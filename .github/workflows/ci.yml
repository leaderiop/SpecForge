name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in test binaries: a core-crate rebuild links ~140 of them, 27% faster without it (measured
  # 108s -> 79s). opt-level 0 was tried too: the build saved 77s, the tests lost 267s. CI backtraces lose file:line.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  ci:
    # `cargo gate ci`'s lint and specs shards; the `build` and `tests` jobs below hold the tests. `dogfood` judges every partition's reports.
    # The lint shard fails when `cargo gate list` holds a check no shard names.
    name: Check list (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lint
            checks: rustfmt,clippy,gsd,doctests,audit
          - shard: specs
            checks: pending-snapshots,spec-format,grammar,zero-entity,layers,file-size,crate-map,links,doc-links,root-layout,builtins,guests,published-schemas,specs,spec-modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A PR's checks are chosen from its diff against the base, so the base's history is needed.
          fetch-depth: 0

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache || matrix.shard }}
          # PRs read main's cache and write none, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binaries: `cargo install` of these took 2–6 min on a cold cache. Versions match gate/src/run.rs.
      - name: Install nextest, cargo-audit and tree-sitter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-audit,tree-sitter-cli@0.27.0

      - name: Install z3 (SMT solver for prove tests)
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Every check of the list is in a shard
        if: matrix.shard == 'lint'
        run: |
          sharded="build,tests,guests,dogfood,rustfmt,clippy,gsd,doctests,audit,pending-snapshots,spec-format,grammar,zero-entity,layers,file-size,crate-map,links,doc-links,root-layout,builtins,published-schemas,specs,spec-modules"
          listed=$(cargo gate list | awk '/^[a-z]/ && $2 != "bootstrap" {print $1}' | sort)
          missing=$(comm -23 <(echo "$listed") <(tr , '\n' <<<"$sharded" | sort))
          if [ -n "$missing" ]; then echo "checks in no shard: $missing"; exit 1; fi

      # tree-sitter-cli and cargo-audit are installed by the checks that need them, at the versions the list pins.
      # A PR runs the checks its diff reaches (quick's triggers); main runs the whole list.
      - name: Run the shard's checks
        run: cargo gate ci --only ${{ matrix.checks }} ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}

      # dogfood reaches only full runs (main), so only main keeps the reports for it.
      - name: Keep the test reports for dogfood
        if: github.event_name == 'push' && matrix.shard == 'specs'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.shard }}
          path: target/specforge
          retention-days: 1

  build:
    # Compiles the tests once into a nextest archive; the four `tests` jobs run it without compiling.
    name: Check list (build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GATE_TEST_ARCHIVE: target/tests.tar.zst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo gate ci --only build ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}
      # A PR whose diff reaches no Rust builds no archive; its `tests` jobs then have nothing to run.
      - uses: actions/upload-artifact@v4
        with:
          name: tests-archive
          path: target/tests.tar.zst
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

  tests:
    name: Check list (tests-${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATE_TEST_ARCHIVE: target/tests.tar.zst
      GATE_TEST_PARTITION: ${{ matrix.part }}/4
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Only `cargo gate` itself compiles here; the tests come from the archive.
      - uses: Swatinem/rust-cache@v2
        with:
          key: specs
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install z3 (SMT solver for prove tests)
        run: sudo apt-get update && sudo apt-get install -y z3
      - uses: actions/download-artifact@v4
        id: archive
        continue-on-error: true
        with:
          name: tests-archive
          path: target
      - name: Run the partition
        if: steps.archive.outcome == 'success'
        run: cargo gate ci --only tests ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}
      - name: Keep the test reports for dogfood
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: reports-tests-${{ matrix.part }}
          path: target/specforge
          retention-days: 1

  dogfood:
    # Every test of every partition and guest reported into target/specforge; dogfood judges them together.
    name: Check list (dogfood)
    needs: [ci, tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: specs
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: target/specforge
          merge-multiple: true
      - name: Run dogfood
        run: cargo gate ci --only dogfood

  # The fresh-clone bootstrap is bootstrap.yml: on a PR it runs only when a blob input changes.
