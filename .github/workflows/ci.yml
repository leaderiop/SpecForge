name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          # Extension crates live outside the workspace; their code compiles
          # to wasm via the specforge-extism build script and needs its own
          # clippy pass to be gated.
          for ext in extensions/*/Cargo.toml; do
            cargo clippy --manifest-path "$ext" --target wasm32-unknown-unknown -- -D warnings
          done

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      - name: Run cargo-audit
        run: cargo install cargo-audit && cargo audit

  bootstrap:
    name: Fresh-clone bootstrap (builtin wasms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # No rust-cache here on purpose: this job must prove that a cold clone
      # bootstrap builds the four builtin extension blobs via the
      # specforge-extism build.rs guard (wayfinder map #1, ticket #4).
      - name: Build specforge-extism (triggers builtin bootstrap)
        run: cargo build -p specforge-extism

      - name: Assert all four builtin blobs exist
        run: |
          test -f extensions/product/target/wasm32-unknown-unknown/release/specforge_ext_product.wasm
          test -f extensions/software/target/wasm32-unknown-unknown/release/specforge_ext_software.wasm
          test -f extensions/governance/target/wasm32-unknown-unknown/release/specforge_ext_governance.wasm
          test -f extensions/formal/target/wasm32-unknown-unknown/release/specforge_ext_formal.wasm

      - name: Build SDK greet fixture
        run: cargo build --manifest-path fixtures/greet-extension/Cargo.toml --target wasm32-unknown-unknown --release

      - name: SDK greet protocol proof
        run: cargo test -p specforge-extism --test tests greet_sdk
