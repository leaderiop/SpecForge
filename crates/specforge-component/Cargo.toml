[package]
name = "specforge-component"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `builtins::load_builtins` and `load_builtins_for`: put builtins into a
# runtime outside the extension load, for tests.
testing = []

[dependencies]
specforge-wasm = { path = "../specforge-wasm" }
specforge-common = { workspace = true }
# `PackageName`: an installed module is read from the directory its name is.
specforge-protocol-types = { path = "../specforge-protocol-types" }
wasmtime = { version = "49.0.2", features = ["component-model", "cache"] }
wasmtime-wasi = "49.0.2"
wit-bindgen = "0.30"

[dev-dependencies]
specforge-component = { path = ".", features = ["testing"] }
# The runtime contract and the SDK-declared greet served in process.
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-wasm = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
wat = "=1.261.0"
serde_json = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }

[[test]]
name = "caught_signals"
harness = false
