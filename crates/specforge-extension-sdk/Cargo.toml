[package]
name = "specforge-extension-sdk"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Author SpecForge extensions in Rust: typed contributions, handshake/describe protocol v1.0.0, and host-function bindings compiled to Wasm"
readme = "README.md"
keywords = ["specforge", "wasm", "component-model", "extensions", "ai-agents"]
categories = ["development-tools"]

[dependencies]
specforge-protocol-types = { path = "../specforge-protocol-types", version = "0.1.0" }
specforge-extension-sdk-macros = { path = "../specforge-extension-sdk-macros", version = "0.1.0" }
wit-bindgen = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
