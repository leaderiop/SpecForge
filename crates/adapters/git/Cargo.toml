[package]
name = "specforge-git"
description = "The adapter behind the effect plane's Git port: the git command line through the Process port, read-only, hardened, with a deadline on every call (ADR 0287, ADR 0335)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Every git call runs through the effect plane's Process port (ADR 0335).
specforge-effects = { path = "../../kernel/effects" }

[dev-dependencies]
specforge-effects = { path = "../../kernel/effects", features = ["testing"] }
specforge-process = { path = "../process" }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
