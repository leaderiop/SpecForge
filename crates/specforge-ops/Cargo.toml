[package]
name = "specforge-ops"
description = "User-level operations (init, add, remove, ...) shared by the CLI and the MCP server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
# MCP owns stdout (it is the JSON-RPC stream): shared operations never print.
print_stdout = "deny"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4.41"
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-common = { workspace = true }
specforge-component = { workspace = true }
specforge-emitter = { path = "../specforge-emitter" }
specforge-formatter = { workspace = true }
specforge-graph = { path = "../specforge-graph" }
specforge-migrate = { workspace = true }
specforge-parser = { workspace = true }
specforge-project = { workspace = true }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-registry = { workspace = true }
specforge-wasm = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
