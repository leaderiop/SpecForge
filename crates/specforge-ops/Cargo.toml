[package]
name = "specforge-ops"
description = "User-level operations (init, add, remove, ...) shared by the CLI and the MCP server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
# MCP owns stdout (it is the JSON-RPC stream): shared operations never print.
print_stdout = "deny"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-common = { workspace = true }
specforge-component = { workspace = true }
specforge-emitter = { path = "../specforge-emitter" }
specforge-formatter = { workspace = true }
specforge-graph = { path = "../specforge-graph" }
specforge-migrate = { workspace = true }
specforge-parser = { workspace = true }
specforge-project = { workspace = true }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-registry = { workspace = true }
specforge-wasm = { workspace = true }
specforge-installed = { path = "../specforge-installed" }
chrono = "0.4.41"
semver = { workspace = true }
strsim = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# Extensions declared with the SDK, served in process.
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
# One diagnostic of each kind the host builds, for the diagnostics JSON pin.
specforge-registry-client = { path = "../specforge-registry-client" }
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = "../specforge-installed", features = ["testing"] }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
