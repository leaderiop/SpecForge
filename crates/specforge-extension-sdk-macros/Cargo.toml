[package]
name = "specforge-extension-sdk-macros"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Attribute macro for the SpecForge extension SDK: generates the __handshake/__describe Wasm exports from a Contributions impl"
readme = "../specforge-extension-sdk/README.md"
keywords = ["specforge", "wasm", "component-model", "macros"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "derive"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
