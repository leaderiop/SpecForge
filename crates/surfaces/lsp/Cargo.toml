[package]
name = "specforge-lsp"
description = "The language server: open documents held in the project session, published diagnostics, navigation, completion, hover and formatting (ADR 0023, ADR 0043, ADR 0046)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-diagnostics = { path = "../../leaf/diagnostics" }
specforge-common = { workspace = true }
specforge-graph = { path = "../../pipeline/graph" }
specforge-ops = { path = "../../app/ops" }
specforge-parser = { workspace = true }
specforge-git = { path = "../../adapters/git" }
specforge-effects = { path = "../../kernel/effects" }
specforge-fs = { path = "../../adapters/fs" }
specforge-http = { path = "../../adapters/http" }
specforge-process = { path = "../../adapters/process" }
specforge-project = { path = "../../session/project" }
specforge-protocol-types = { path = "../../leaf/protocol-types" }
specforge-registry = { path = "../../pipeline/registry" }
specforge-resolver = { path = "../../pipeline/resolver" }
specforge-watch = { path = "../../session/watch", features = ["tokio"] }
tower-lsp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The repositories the tests that commit build, with no git program.
specforge-git = { path = "../../adapters/git", features = ["testing"] }
specforge-repo-root = { path = "../../leaf/repo-root" }
specforge-project = { path = "../../session/project", features = ["testing"] }
# The fake ports (`specforge_effects::testing`): a test gives a surface fakes, or a fake git.
specforge-effects = { path = "../../kernel/effects", features = ["testing"] }
tree-sitter = { workspace = true }
specforge-component = { path = "../../runtime/component", features = ["testing"] }
specforge-installed = { path = "../../runtime/installed", features = ["testing"] }
specforge-extension-sdk = { path = "../../runtime/extension-sdk" }
specforge-wasm = { path = "../../runtime/wasm", features = ["testing"] }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
tree-sitter-specforge = { workspace = true }

[lints]
workspace = true
