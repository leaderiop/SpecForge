[package]
name = "specforge-project"
description = "The compiled project: one environment load, one compile, shared by every surface"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[lints.clippy]
# MCP owns stdout (it is the JSON-RPC stream): the shared compile never prints.
print_stdout = "deny"

[dependencies]
specforge-common = { workspace = true }
specforge-emitter = { path = "../specforge-emitter" }
specforge-graph = { path = "../specforge-graph" }
specforge-registry = { workspace = true }
specforge-resolver = { path = "../specforge-resolver" }
specforge-wasm = { workspace = true }

[dev-dependencies]
specforge-component = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
