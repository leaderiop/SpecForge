[package]
name = "specforge-checks-kit"
description = "The bare algorithms, parsers and pinned tables of generic value checks, for @specforge/checks and the domain packs that build on it"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
digits = []
formats = [
    "dep:croner",
    "dep:email_address",
    "dep:jiff",
    "dep:language-tags",
    "dep:mime",
    "dep:regex-automata",
    "dep:semver",
    "dep:spdx",
    "dep:uuid",
]
links = ["dep:percent-encoding", "dep:url"]
files = []
media = ["dep:imagesize", "dep:quick-xml"]
pdf = ["dep:miniz_oxide"]
registries = [
    "digits",
    "dep:nodejs-semver",
    "dep:pep440_rs",
    "dep:percent-encoding",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:spdx",
]
structured = ["dep:percent-encoding", "dep:serde_json", "dep:toml", "dep:yaml-rust2"]
git = []

[dependencies]
croner = { version = "4.0.2", optional = true }
email_address = { version = "0.2.9", default-features = false, optional = true }
# The headers of the image formats a web page shows, and no others.
imagesize = { version = "0.15.0", default-features = false, features = [
    "bmp",
    "gif",
    "heif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
], optional = true }
# No bundled tz database: `iana_tz` reads the pinned names, and jiff only reads calendars and durations.
jiff = { version = "0.2.39", default-features = false, features = ["std"], optional = true }
language-tags = { version = "0.3.2", optional = true }
mime = { version = "0.3.17", optional = true }
miniz_oxide = { version = "0.8.9", optional = true }
# npm's range grammar and its prerelease rule, as node-semver reads them.
nodejs-semver = { version = "7.0.0", optional = true }
# PEP 440 versions and specifiers, as pip and uv read them.
pep440_rs = { version = "0.7.3", optional = true }
# Without `encoding`: an SVG is read as UTF-8 bytes; names and attributes are compared as bytes.
quick-xml = { version = "0.42.0", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
# The parser and NFA compiler `regex` is built on, without its search engines: what the kernel's `matches` compiles.
regex-automata = { version = "0.4.14", default-features = false, features = [
    "std",
    "syntax",
    "nfa-thompson",
    "unicode",
], optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
spdx = { version = "0.13.6", optional = true }
url = { version = "2.5.8", optional = true }
toml = { workspace = true, optional = true }
uuid = { version = "1.23.1", default-features = false, features = ["std"], optional = true }
# The event parser alone: the tree is built here, so aliases are counted before they are copied.
yaml-rust2 = { version = "0.13.0", default-features = false, optional = true }

[dev-dependencies]
regex = { workspace = true }
# Every family's tests run in the workspace's test build, which enables no feature of its own.
specforge-checks-kit = { path = ".", features = [
    "digits",
    "files",
    "formats",
    "git",
    "links",
    "media",
    "pdf",
    "registries",
    "structured",
] }

[lints]
workspace = true
