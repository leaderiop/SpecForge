[package]
name = "specforge-checks-kit"
description = "The bare algorithms, parsers and pinned tables of generic value checks, for @specforge/checks and the domain packs that build on it"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
digits = []
formats = [
    "dep:croner",
    "dep:email_address",
    "dep:jiff",
    "dep:language-tags",
    "dep:mime",
    "dep:regex-automata",
    "dep:semver",
    "dep:spdx",
    "dep:uuid",
]
links = ["dep:percent-encoding", "dep:url"]
files = []
git = []

[dependencies]
croner = { version = "4.0.2", optional = true }
email_address = { version = "0.2.9", default-features = false, optional = true }
# No bundled tz database: `iana_tz` reads the pinned names, and jiff only reads calendars and durations.
jiff = { version = "0.2.39", default-features = false, features = ["std"], optional = true }
language-tags = { version = "0.3.2", optional = true }
mime = { version = "0.3.17", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
# The parser and NFA compiler `regex` is built on, without its search engines: what the kernel's `matches` compiles.
regex-automata = { version = "0.4.14", default-features = false, features = [
    "std",
    "syntax",
    "nfa-thompson",
    "unicode",
], optional = true }
semver = { workspace = true, optional = true }
spdx = { version = "0.13.6", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.23.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
regex = { workspace = true }

[lints]
workspace = true
