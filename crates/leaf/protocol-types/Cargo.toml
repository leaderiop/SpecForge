[package]
name = "specforge-protocol-types"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "The guest wire of the SpecForge extension protocol: the handshake, the describe payloads, the operation payloads, the command-arg rule and the shell-word reader, which the host and every guest compile (ADR 0012, 0013, 0050, 0292)"
readme = "../../../docs/extension-protocol.md"

[dependencies]
serde = { workspace = true }
# `raw_value`: the command input splices the host's rendered graph (`RawGraph`). `float_roundtrip`: a guest reads a
# JSON number as the binary64 nearest its text, so a `Decimal` written out reads back (ADR 0361 D2).
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
specforge-repo-root = { path = "../repo-root" }
specforge-test-macros = { workspace = true }
specforge-test = { workspace = true }

[lints]
workspace = true
